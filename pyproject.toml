[project]
name = "pyTMBot"
version = "0.5.2"
description = "Versatile Telegram bot designed for managing Docker containers, monitoring server status, and extending its functionality through a modular plugin system. The bot operates synchronously, simplifying deployment by eliminating the need for webhooks"
authors = [{ name = "Denis Rozhnovskiy", email = "pytelemonbot@mail.ru" }]
requires-python = ">=3.12,<4"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "telegram",
    "bot",
    "docker",
    "monitoring",
    "server",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Monitoring",
    "Topic :: Communications :: Chat",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "emoji>=2.16.0",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "docker>=7.2.0",
    "humanize>=4.16.0",
    "psutil>=7.2.2",
    "pyotp>=2.10.0",
    "loguru>=0.7.3",
    "pyyaml>=6.0.3",
    "pygal>=3.1.3",
    "pytelegrambotapi>=4.37.1",
    "fastapi>=0.156.4",
    "uvicorn>=0.54.0",
    "influxdb-client>=1.50.0",
    "pypng>=0.20220715.0",
    "qrcode>=8.2,<9",
    "aiohttp>=3.14.5",
    "packaging>=26.3",
    "python-dateutil>=2.9.0.post0",
    "cachetools>=7.2.4,<8",
]

[project.optional-dependencies]
pyoutlineapi = ["pyoutlineapi>=0.4.0"]
click = ["click>=8.5.0"]

[project.urls]
Homepage = "https://github.com/orenlab/pytmbot"
Documentation = "https://orenlab.github.io/pytmbot/"
Repository = "https://github.com/orenlab/pytmbot"

[dependency-groups]
dev = [
    "ruff>=0.17.1,<0.18",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0,<8",
    "mypy>=2.4.0,<3",
    "codeclone[mcp]>=2.0.2,<2.1",
    "types-cachetools>=7.0.0.20260713,<8",
    "types-PyYAML>=6.0.12.20260906,<7",
    "types-python-dateutil>=2.9.0.20261021,<3",
    "types-requests>=2.33.0.20261006,<3",
    "pre-commit>=4.7.0",
    "zensical>=0.0.71",
]

[project.scripts]
pytmbot = "pytmbot.main:main"

[tool.uv]
# uv < 0.13.4 trusts the distrusted emSign root (GHSA-hq85-5cpj-mr62).
required-version = ">=0.13.4"

[tool.uv.build-backend]
module-name = ["pytmbot"]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"
lint.select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "N", # pep8-naming
]
lint.ignore = [
    "E501", # line too long (если используете formatter)
    "B019", # lru_cache on instance methods (existing intentional caches)
    "N815", # allow external camelCase field names for API models
    "N818", # keep existing BaseBotException naming
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "dist",
    "build",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
strict = true
files = ["pytmbot", "tests"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=pytmbot"
testpaths = [
    "tests",
]
