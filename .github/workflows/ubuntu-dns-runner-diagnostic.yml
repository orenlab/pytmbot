name: Ubuntu DNS runner diagnostics (temporary)

on:
  push:
    branches:
      - feat/trivy-image-scanning-103
    paths:
      - .github/workflows/ubuntu-dns-runner-diagnostic.yml

permissions:
  contents: read

jobs:
  dns:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check host Ubuntu mirror DNS
        shell: bash
        run: |
          set +e
          echo "Runner: ${{ matrix.os }}"
          echo "DNS:"
          resolvectl dns
          for domain in archive.ubuntu.com security.ubuntu.com ports.ubuntu.com github.com; do
            echo "NAME=${domain}"
            timeout 5 getent ahostsv4 "${domain}" | head -n 2
            echo "status=${PIPESTATUS[0]}"
          done
