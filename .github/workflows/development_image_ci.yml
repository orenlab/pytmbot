name: Push Ubuntu Dev Image

on:
  push:
    branches:
      - '**'  # слушаем все ветки

concurrency:
  group: dev-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  push_dev_image:
    if: |
      startsWith(github.ref, 'refs/heads/fix/') ||
      startsWith(github.ref, 'refs/heads/feat/') ||
      endsWith(github.ref, '-deps')
    name: Build and Push Dev Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Diagnose Ubuntu archive DNS on GitHub runner
        shell: bash
        run: |
          set +e
          echo "Runner DNS configuration:"
          sed -n '1,30p' /etc/resolv.conf
          for domain in archive.ubuntu.com security.ubuntu.com ports.ubuntu.com github.com; do
            echo "HOST ${domain}"
            timeout 8 getent ahostsv4 "${domain}"
            echo "exit=$?"
          done
          echo "Docker host-network DNS:"
          timeout 40 docker run --rm --network host ubuntu:26.04 sh -c             'cat /etc/resolv.conf; getent hosts archive.ubuntu.com; getent hosts security.ubuntu.com'
          echo "docker-host exit=$?"
          echo "Docker bridge-network DNS:"
          timeout 40 docker run --rm ubuntu:26.04 sh -c             'cat /etc/resolv.conf; getent hosts archive.ubuntu.com; getent hosts security.ubuntu.com'
          echo "docker-bridge exit=$?"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: linux/amd64,linux/arm64

      # BuildKit's daemon network is not inherited by Dockerfile RUN steps.
      # Use the ephemeral GitHub-hosted runner network for APT DNS during this
      # branch-only development build. Production workflows remain unchanged.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver-opts: |
            image=moby/buildkit:v0.34.0
            network=host
          buildkitd-flags: >-
            --allow-insecure-entitlement network.host

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: orenlab/pytmbot
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch,prefix=edge-
            type=sha,prefix=edge-sha-
          labels: |
            org.opencontainers.image.title=pyTMbot
            org.opencontainers.image.description=Versatile Telegram bot designed for managing Docker containers, monitoring server status, and extending its functionality through a modular plugin system
            org.opencontainers.image.source=https://github.com/orenlab/pytmbot

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: build-and-push
        with:
          context: .
          target: production
          file: Dockerfile
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          # Host networking applies to BuildKit RUN containers, not just the
          # BuildKit daemon. This is only used by the dev-image workflow.
          network: host
          allow: |
            network.host
          build-args: |
            COMPILE_BYTECODE=0
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
