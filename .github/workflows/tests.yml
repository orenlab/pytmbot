name: Python Tests

on:
  push:
    branches: [ "**" ]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTMBOT_CONFIG_PATH: pytmbot.yaml.sample
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12", "3.13", "3.14" ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Run tests
        # Smoke CLI tests intentionally disable subprocess coverage collection
        # to avoid runner-specific flakiness while keeping parent-process coverage strict.
        run: uv run pytest --cov=pytmbot --cov-report=term-missing --cov-fail-under=80


  codeclone:
    name: CodeClone structural gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: CodeClone v2.0.3
        uses: orenlab/codeclone/.github/actions/codeclone@1dc1aa0386fe42f48e8bc7d3b23715ae42a2be22 # v2.0.3
        with:
          python-version: "3.14"
          package-version: "2.0.3"
          require-baseline: "true"
          baseline-path: "codeclone.baseline.json"
          metrics-baseline-path: "codeclone.baseline.json"
          fail-on-new: "true"
          fail-on-new-metrics: "true"
          extra-args: "--ci"
          sarif: "true"
          pr-comment: "true"

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy .
